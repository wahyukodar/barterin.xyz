<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <script type="text/javascript">
        // Ketika halaman di refresh dengan route tertentu maka akan error 404 github pages
        // Maka dari itu perlu buat file ini agar redirect ke index.html
        // Script SPA GitHub Pages
        // Source: https://github.com/rafgraph/spa-github-pages
        var pathSegmentsToKeep = 0; // kalau sub.domain.com → 0, kalau domain.com/repo → 1
        var l = window.location;
        l.replace(
            l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
            '/?/' +
            l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
